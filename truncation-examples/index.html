<h1>Title tiering + description truncation examples</h1>

<figure><img src="03-long-title.png"><figcaption>03 — long title, wraps 3 lines (34px tier)</figcaption></figure>
<figure><img src="04-long-desc-truncated.png"><figcaption>04 — long description, truncated with ellipsis</figcaption></figure>
<figure><img src="05-worst-case-both-long.png"><figcaption>05 — worst case: long title + long description together</figcaption></figure>
